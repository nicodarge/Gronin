---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: detect-private-key
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-executables-have-shebangs
      - id: no-commit-to-branch
        args: ['--branch', 'production']

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.47.0
    hooks:
      - id: markdownlint
        args: ['--disable', 'MD013', 'MD033', 'MD041', '--']
        # Vendored Spec Kit assets, refreshed by the Specify CLI.
        exclude: '^(\.claude/skills/speckit-|\.specify/(templates|scripts|integrations|workflows)/)'

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.7
    hooks:
      - id: actionlint

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.6
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/golangci/golangci-lint
    rev: v2.13.2
    hooks:
      # -full rather than the default hook: that one lints only what changed, which
      # silently disables every linter that has to see the whole module to say
      # anything — `unused` first among them.
      - id: golangci-lint-full
        entry: bash -c 'cd runtime && golangci-lint run --fix'
      - id: golangci-lint-config-verify
        entry: bash -c 'cd runtime && golangci-lint config verify'

  - repo: local
    hooks:
      # Both are `manual`: they are the merge gate, and CI is where the merge gate
      # belongs. Run before every push they cost minutes, long enough that git's own
      # SSH connection idles out and GitHub drops it mid-hook. The CI jobs `suite` and
      # `mutation` run them on every pull request and on every push to production, so
      # nothing merges without them. Locally, on demand:
      #     pre-commit run --hook-stage manual go-suite mutation
      - id: go-suite
        name: the Go suite, hermetic and race-enabled
        entry: scripts/run-suite.sh
        language: script
        stages: [manual]
        files: '^runtime/'
        pass_filenames: false

      - id: mutation
        name: the mutation harness kills every declared mutant
        entry: scripts/check-mutation.py
        language: python
        stages: [manual]
        files: '^(runtime/|scripts/check-mutation\.py$)'
        pass_filenames: false

      # Both sweep the whole tree rather than the changed files: the failures they
      # exist for are a document contradicting a neighbour nobody edited.
      - id: doc-examples
        name: documented playbook examples validate
        entry: scripts/check-doc-examples.py
        language: python
        additional_dependencies: [jsonschema==4.23.0, pyyaml==6.0.2]
        pass_filenames: false
        always_run: true

      - id: spec-refs
        name: spec identifiers resolve
        entry: scripts/check-spec-refs.py
        language: python
        pass_filenames: false
        always_run: true
