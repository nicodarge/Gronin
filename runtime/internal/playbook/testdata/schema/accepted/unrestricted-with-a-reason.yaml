name: package-audit
description: >-
  Runs unrestricted because the audit shells out to the package manager, which no
  file tool can stand in for.
trigger:
  type: cron
  schedule: "30 2 * * 1"
agent:
  model: claude-sonnet-5
  prompt_file: package-audit.md
  restricted: false
  output_schema:
    type: object
sinks:
  - github:
      repo: ${config.audit_repo}
      cap: 3
