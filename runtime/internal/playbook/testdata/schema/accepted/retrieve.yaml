name: disk-check
trigger: {type: manual}
gather:
  - run: df -h /var
    as: facts.txt
retrieve:
  - collection: runbooks
    as: runbooks.md
    query: disk full on ${trigger.mountpoint}
  - collection: runbooks
    as: by-facts.md
    query_from: facts.txt
    max_results: 5
    max_bytes: 4096
agent: {model: m, prompt_file: p.md, output_schema: {type: object}}
sinks: [{discord: {channel: "#ops"}}]
