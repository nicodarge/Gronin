name: webhook-undeclared-gather-reference
trigger:
  type: webhook
  source: alerts
  values:
    alertname:
      at: /alertname
      pattern: "[a-z ]+"
      max_length: 40
gather:
  - run: echo ${trigger.other}
    as: out.txt
agent:
  model: claude-sonnet-5
  prompt_file: prompt.md
  output_schema:
    type: object
sinks:
  - discord:
      webhook: ${config.ops_webhook}
