name: retrieve-colliding-name
trigger:
  type: manual
gather:
  - run: df -h /var
    as: facts.txt
retrieve:
  - collection: runbooks
    as: facts.txt
    query: disk full on /var
agent:
  model: claude-sonnet-5
  prompt_file: prompt.md
  output_schema:
    type: object
sinks:
  - discord:
      webhook: ${config.ops_webhook}
