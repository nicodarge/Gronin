name: webhook-sink-reference
trigger:
  type: webhook
  source: alerts
  values:
    alertname:
      at: /alertname
      pattern: "[a-z ]+"
      max_length: 40
agent:
  model: claude-sonnet-5
  prompt_file: prompt.md
  output_schema:
    type: object
sinks:
  - discord:
      webhook: ${trigger.alertname}
  - github:
      repo: ${trigger.alertname}
      cap: 3
