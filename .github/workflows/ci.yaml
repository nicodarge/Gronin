---
name: CI

on:
  pull_request:
  push:
    branches: [production]

permissions:
  contents: read

jobs:
  # Every static hook, from the file that already pins them. A second pin in this
  # workflow would be a second thing to bump, and the one that drifts is the copy.
  # The two heavy hooks are `manual` there and have jobs of their own below;
  # no-commit-to-branch is a local guard and refuses the production checkout this job
  # does on a push.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: runtime/go.mod
      - run: pipx install pre-commit
      - env:
          SKIP: no-commit-to-branch
        run: pre-commit run --all-files --show-diff-on-failure

  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: runtime/go.mod
      # The suite runs with no route to the network, so every module it needs has to
      # be in the cache before that starts.
      - run: go mod download
        working-directory: runtime
      - run: scripts/run-suite.sh

  # The self-test on its own, once: a count from a harness that has not shown it can
  # report zero is not a count, and every matrix leg below would otherwise pay for it
  # again for no more assurance.
  mutation-self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: runtime/go.mod
      - run: go mod download
        working-directory: runtime
      - run: scripts/check-mutation.py --self-test

  # The real run, split across the matrix legs so no single runner carries the whole
  # list sequentially; --shard partitions by position, so the legs together cover
  # exactly the mutants a single unsharded run would. The matrix list below sets the
  # leg count and nothing else -- the shard number and total are read back from
  # GitHub's own strategy context rather than written out a second time, so the two
  # cannot drift apart (job-index is documented as zero-based; job-total is the
  # product of the matrix dimensions, one here since the matrix has a single key).
  # needs: mutation-self-test, so a harness that has not just shown it can report
  # zero on this runner image never gets to produce a count on it.
  mutation:
    needs: mutation-self-test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        leg: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: runtime/go.mod
      - run: go mod download
        working-directory: runtime
      - run: >-
          scripts/check-mutation.py
          --shard "$(( ${{ strategy.job-index }} + 1 ))/${{ strategy.job-total }}"

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: runtime/go.mod
      - name: Cross-compile
        working-directory: runtime
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -o "../gronin-${GOOS}-${GOARCH}" ./cmd/gronin
      # A build compiles no test file, so a per-OS file's tests are checked by nothing
      # until the day someone runs the suite on that OS. vet compiles them.
      - name: The tests compile for this target
        working-directory: runtime
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go vet ./...
      - name: The artifact is self-contained
        run: scripts/check-static.sh "gronin-${{ matrix.goos }}-${{ matrix.goarch }}"

  # Once, not once per target: it builds host binaries either way, so running it in
  # each matrix leg would repeat the same check three times and say nothing more.
  static-check-refuses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: runtime/go.mod
      - run: scripts/check-static.sh --self-test

  # One check for branch protection to require. Without it, protection has to name
  # every job above and silently stops covering a job added later.
  gate:
    runs-on: ubuntu-latest
    needs: [checks, suite, mutation-self-test, mutation, build, static-check-refuses]
    if: always()
    permissions:
      actions: read
    steps:
      - name: Every gate passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "a required check did not pass" >&2
              exit 1
            fi
          done
      # needs.*.result rolls a matrix job up into one result, but GitHub's own docs
      # never say what a failed or cancelled leg does to that roll-up, and a report
      # from the field claims it can read success regardless. Not trusted blindly:
      # this asks the Actions API directly for every job this run/attempt actually
      # ran, including every matrix leg by its own name, and fails unless each one
      # (other than gate itself) concluded success -- which also covers the build
      # matrix, resting on the same unconfirmed assumption.
      - name: Every job in this run actually succeeded
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          jobs=$(gh api --paginate \
            "repos/${REPO}/actions/runs/${RUN_ID}/attempts/${RUN_ATTEMPT}/jobs" \
            --jq '.jobs[] | [.name, .conclusion] | @tsv')
          echo "$jobs"
          found_mutation_leg=0
          failed=0
          while IFS=$'\t' read -r name conclusion; do
            [ -z "$name" ] && continue
            case "$name" in
              "mutation ("*)
                found_mutation_leg=1
                ;;
            esac
            if [ "$name" = "gate" ]; then
              continue
            fi
            if [ "$conclusion" != "success" ]; then
              echo "job '$name' concluded '$conclusion', not success" >&2
              failed=1
            fi
          done <<< "$jobs"
          if [ "$found_mutation_leg" -ne 1 ]; then
            echo "no 'mutation (...)' matrix leg was found in this run" >&2
            failed=1
          fi
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
