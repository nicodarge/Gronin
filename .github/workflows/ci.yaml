---
name: CI

on:
  pull_request:
  push:
    branches: [production]

permissions:
  contents: read

jobs:
  # Every static hook, from the file that already pins them. A second pin in this
  # workflow would be a second thing to bump, and the one that drifts is the copy.
  # The two heavy hooks have jobs of their own below; no-commit-to-branch is a local
  # guard and refuses the production checkout this job does on a push.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: runtime/go.mod
      - run: pipx install pre-commit
      - env:
          SKIP: go-suite,mutation,no-commit-to-branch
        run: pre-commit run --all-files --show-diff-on-failure

  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: runtime/go.mod
      # The suite runs with no route to the network, so every module it needs has to
      # be in the cache before that starts.
      - run: go mod download
        working-directory: runtime
      - run: scripts/run-suite.sh

  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: runtime/go.mod
      - run: go mod download
        working-directory: runtime
      # The self-test first: a count from a harness that has not shown it can report
      # zero is not a count.
      - run: scripts/check-mutation.py --self-test
      - run: scripts/check-mutation.py

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: runtime/go.mod
      - name: Cross-compile
        working-directory: runtime
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -o "../gronin-${GOOS}-${GOARCH}" ./cmd/gronin
      - name: The check refuses what it is meant to refuse
        run: scripts/check-static.sh --self-test
      - name: The artifact is self-contained
        run: scripts/check-static.sh "gronin-${{ matrix.goos }}-${{ matrix.goarch }}"

  # One check for branch protection to require. Without it, protection has to name
  # every job above and silently stops covering a job added later.
  gate:
    runs-on: ubuntu-latest
    needs: [checks, suite, mutation, build]
    if: always()
    steps:
      - name: Every gate passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "a required check did not pass" >&2
              exit 1
            fi
          done
